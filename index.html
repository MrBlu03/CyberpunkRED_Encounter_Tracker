<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=./gm-tool/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <script>
    // JS redirect (preferred): replaces history so Back won't bounce here
    (function () {
      var target = "./gm-tool/";
      if (location.pathname.endsWith("/") || location.pathname === "") {
        window.location.replace(target);
      } else {
        // If this file is nested, build a relative URL safely
        var base = location.pathname.substring(0, location.pathname.lastIndexOf("/") + 1);
        window.location.replace(base + target);
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="./gm-tool/">the GM Tool</a>…</p>
  </noscript>
</body>
</html>
