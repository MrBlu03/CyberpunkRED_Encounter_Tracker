name: Build Desktop App

on:
  push:
    branches: [ V2 ]
    paths:
      - 'gm-tool/package.json'
  pull_request:
    branches: [ V2 ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gm-tool/package-lock.json
      
      - name: Get version from package.json
        id: version
        run: |
          cd gm-tool
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Install dependencies
        run: |
          cd gm-tool
          npm ci
      
      - name: Generate data files
        run: |
          cd gm-tool
          npm run generate-data
      
      - name: Build Vite app
        run: |
          cd gm-tool
          npm run build
      
      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd gm-tool
          npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd gm-tool
          npx electron-builder --mac --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd gm-tool
          npx electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ steps.version.outputs.version }}
          path: gm-tool/release/*.exe
          retention-days: 30
      
      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ steps.version.outputs.version }}
          path: gm-tool/release/*.dmg
          retention-days: 30
      
      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-${{ steps.version.outputs.version }}
          path: gm-tool/release/*.AppImage
          retention-days: 30

  # Create release when package.json changes
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from package.json
        id: version
        run: |
          cd gm-tool
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            ./artifacts/windows-build-${{ steps.version.outputs.version }}/*
            ./artifacts/macos-build-${{ steps.version.outputs.version }}/*
            ./artifacts/linux-build-${{ steps.version.outputs.version }}/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Cyberpunk RED GM Tool v${{ steps.version.outputs.version }}
            
            ### What's New
            - Updated version to ${{ steps.version.outputs.version }}
            
            ### Downloads
            - **Windows**: `.exe` installer
            - **macOS**: `.dmg` disk image
            - **Linux**: `.AppImage` portable executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}