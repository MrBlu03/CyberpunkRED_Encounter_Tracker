name: Build Desktop App

on:
  push:
    branches: [ V2 ]
    paths:
      - 'gm-tool/package.json'
  pull_request:
    branches: [ V2 ]
    paths:
      - 'gm-tool/package.json'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
            artifact_pattern: "*.exe"
          - os: macos-latest
            platform: mac
            artifact_pattern: "*.{dmg,zip}"
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: "*.{AppImage,deb,rpm}"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gm-tool/package-lock.json
      
      - name: Get version from package.json
        id: version
        run: |
          cd gm-tool
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
      
      - name: Install dependencies
        run: |
          cd gm-tool
          npm ci
      
      - name: Generate data files
        run: |
          cd gm-tool
          npm run generate-data
      
      - name: Build Vite app
        run: |
          cd gm-tool
          npm run build
      
      - name: Build Electron app
        run: |
          cd gm-tool
          npx electron-builder --${{ matrix.platform }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'false' || '' }}
      
      - name: List built files (debug)
        run: |
          echo "Contents of gm-tool/release:"
          ls -la gm-tool/release/ || echo "Release directory not found"
        shell: bash
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build-${{ steps.version.outputs.version }}
          path: gm-tool/release/
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from package.json
        id: version
        run: |
          cd gm-tool
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download all artifacts
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Prepare release files
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p ./release-files
          find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} ./release-files/ \;
          
          echo "Files prepared for release:"
          ls -la ./release-files/
        shell: bash
      
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          files: ./release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Cyberpunk RED GM Tool v${{ steps.version.outputs.version }}
            
            ### Downloads
            Choose the appropriate file for your operating system:
            
            - **Windows**: Download the `.exe` file
            - **macOS**: Download the `.dmg` file  
            - **Linux**: Download the `.AppImage` file (or `.deb`/`.rpm` if preferred)
            
            ### Installation
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open the `.dmg` and drag to Applications folder
            - **Linux**: Make the `.AppImage` executable and run it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}