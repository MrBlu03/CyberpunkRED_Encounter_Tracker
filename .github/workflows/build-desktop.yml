name: Build Desktop App

on:
  push:
    branches: [ V2 ]
    paths:
      - 'gm-tool/package.json'
  pull_request:
    branches: [ V2 ]

permissions:
  contents: write
  packages: write

jobs:
  # Check for version changes and create tag if needed
  check-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/V2'
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      new-version: ${{ steps.check.outputs.new-version }}
      tag-name: ${{ steps.check.outputs.tag-name }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for version changes
        id: check
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./gm-tool/package.json').version")
          echo "Current version in package.json: $CURRENT_VERSION"
          
          # Check if this version tag already exists
          if git tag -l "v$CURRENT_VERSION" | grep -q "v$CURRENT_VERSION"; then
            echo "Tag v$CURRENT_VERSION already exists, skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: v$CURRENT_VERSION"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "new-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "tag-name=v$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi
      
      - name: Create and push tag
        if: steps.check.outputs.should-release == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag ${{ steps.check.outputs.tag-name }}
          git push origin ${{ steps.check.outputs.tag-name }}

  build:
    runs-on: ${{ matrix.os }}
    needs: check-version
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && needs.check-version.outputs.should-release == 'true') ||
      startsWith(github.ref, 'refs/tags/')
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: gm-tool/package-lock.json
      
      - name: Install dependencies
        run: |
          cd gm-tool
          npm ci
      
      - name: Generate data files
        run: |
          cd gm-tool
          npm run generate-data
      
      - name: Build Vite app
        run: |
          cd gm-tool
          npm run build
      
      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd gm-tool
          npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd gm-tool
          npx electron-builder --mac --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd gm-tool
          npx electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: gm-tool/release/*.exe
          retention-days: 30
      
      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: gm-tool/release/*.dmg
          retention-days: 30
      
      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: gm-tool/release/*.AppImage
          retention-days: 30

  # Create release when pushing a tag
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/windows-build/*
            ./artifacts/macos-build/*
            ./artifacts/linux-build/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}