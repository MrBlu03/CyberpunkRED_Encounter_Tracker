<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'">
    <title>Player Character Manager - Cyberpunk Red Initiative Tracker</title>
    <link rel="stylesheet" href="../css/local-fonts.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pc-manager.css">
</head>
<body>
  
    <!-- Navigation Dropdown - Fixed in top-left corner -->
    <div class="nav-container">
        <div class="nav-dropdown">
            <button class="nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
                Navigation
            </button>
            <div class="nav-content">
                <a href="index.html">Initiative Tracker</a>
                <a href="pc-manager.html">Player Characters</a>
                <a href="netrunner.html">Netrunner Interface</a>
                <a href="timetracker.html">Time Tracker</a>
                <a href="tarot-deck.html">Tarot Deck</a>
                <a href="settings.html">Settings</a>
            </div>
        </div>
    </div>
    
    <!-- Main content -->
    <div id="app">
        <div class="character-form-section">
            <h2>Create Character</h2>
            <div class="player-character-form">
                <input type="text" id="pc-name" placeholder="Character Name" class="full-width">
                <input type="number" id="pc-base" placeholder="Base Initiative">
                <input type="number" id="pc-maxHealth" placeholder="Max Health">
                <input type="number" id="pc-bodyArmor" placeholder="Body SP">
                <input type="number" id="pc-headArmor" placeholder="Head SP">
                <input type="number" id="pc-shield" placeholder="Shield SP">
                <!-- Add Interface Skill field -->
                <input type="number" id="pc-interface" placeholder="Interface Skill" min="0" max="10">
                <div class="full-width" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <label for="pc-role" style="min-width:80px;">Role</label>
                    <select id="pc-role" style="flex:1; min-width:200px;"></select>
                    <button type="button" id="reload-packs-btn" title="Reload packs from disk">Reload Packs</button>
                </div>
                <div class="full-width">
                    <h4>Skills</h4>
                    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
                        <input type="text" id="skill-search" placeholder="Search skill..." list="skill-options" style="flex:1;">
                        <datalist id="skill-options"></datalist>
                        <input type="number" id="skill-level" min="0" max="10" placeholder="Lvl" style="width:70px;">
                        <button type="button" id="add-skill-btn">Add Skill</button>
                    </div>
                    <div id="pc-skill-list" class="skill-list"></div>
                </div>
                <div id="pc-weapon-fields" class="full-width"></div>
                <button type="button" id="add-weapon-btn" class="full-width">Add Weapon</button>
                <div class="full-width" style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                    <input type="text" id="weapon-search" placeholder="Search weapon from catalog..." list="weapon-options" style="flex:1;">
                    <datalist id="weapon-options"></datalist>
                    <button type="button" id="add-weapon-from-catalog-btn">Add from Catalog</button>
                </div>
                <div class="notes-section full-width">
                    <h4>Character Notes</h4>
                    <textarea id="pc-notes" class="character-notes" placeholder="Add notes about abilities, cyberware, or other details..."></textarea>
                </div>
                <div class="import-export-controls full-width">
                    <button id="save-character-btn">Save Character</button>
                    <button id="export-characters-btn">Export All</button>
                    <input type="file" id="importPCFile" accept=".json" style="display: none">
                    <button id="import-btn">Import</button>
                </div>
                <div class="full-width" style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                    <button type="button" id="copy-share-code-btn" title="Copy a compact code for this character">Copy Share Code</button>
                    <input type="text" id="share-code-input" placeholder="Paste share code here" style="flex:1;">
                    <button type="button" id="import-share-code-btn">Import from Code</button>
                </div>
                <span class="import-export-info full-width" id="pc-import-export-status"></span>
            </div>
        </div>
        
        <div class="character-list-section">
            <h2>Character List</h2>
            <div id="pc-list" class="player-character-list"></div>
        </div>
    </div>

    <!-- Add navigation.js before other scripts -->
    <script src="../js/utils/navigation.js"></script>
    <script src="../js/utils/catalog.js"></script>
    <script src="../js/components/catalog-adapters.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/pc-manager-init.js"></script>
</body>
</html>
